<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Verify Codes — NotHumans</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Rajdhani',sans-serif;background:#0c0604;color:#fff8f0;min-height:100vh;}
:root{--line:rgba(255,180,60,0.18);--gold:#ffc61a;--text-dim:rgba(255,248,240,0.62);--panel:rgba(28,14,8,0.72);}
nav{height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.nav-word{font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px;}
.nav-word span{color:var(--gold);}
a.back{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:10px;text-decoration:none;letter-spacing:1px;}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px;}
.h{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;margin-bottom:6px;}
.sub{font-size:13px;color:var(--text-dim);margin-bottom:18px;}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;margin-bottom:10px;}
.team{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:800;}
.meta{font-size:12px;color:var(--text-dim);margin-top:4px;}
.code{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:3px;color:var(--gold);margin:10px 0;cursor:pointer;}
.btn{display:inline-block;margin-top:6px;padding:10px 14px;border:none;border-radius:8px;background:linear-gradient(135deg,#ffc61a,#ff9d00);color:#1a0a00;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;cursor:pointer;transition:filter .15s ease,transform .15s ease;}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
.empty{text-align:center;padding:40px 12px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;color:var(--text-dim);}
.login{text-align:center;padding:40px 16px;}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#111;border:none;border-radius:10px;padding:12px 18px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:800;cursor:pointer;}
</style>
</head>
<body>
<nav>
  <div class="nav-word">NH <span>VERIFY</span></div>
  <a class="back" href="index.html">HOME</a>
</nav>
<div class="wrap" id="app"><div class="empty">LOADING…</div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDrg8CHeOGiPR9kFLSTreRbP4p8TGF9jMY",
  authDomain: "nothumans-7e285.firebaseapp.com",
  projectId: "nothumans-7e285",
  storageBucket: "nothumans-7e285.firebasestorage.app",
  messagingSenderId: "409725804600",
  appId: "1:409725804600:web:ec0344bf1ac49a55edc6cd"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let adminWa = '';
let regs = [];

async function loadSettings(){
  try {
    const snap = await getDoc(doc(db, 'settings', 'global'));
    if(snap.exists()){
      const d = snap.data();
      adminWa = String(d.adminWhatsapp || d.whatsapp || '').replace(/\D/g,'');
    }
  } catch(_){}
}

function invoice(r){
  return [
    '*NH ENTRY INVOICE*',
    '',
    `Tournament: ${r.matchName || '—'}`,
    `Entry: ₹${r.entryFee || 0}`,
    `Date/Time: ${r.matchTime || '—'}`,
    `Prize Pool: ${r.matchPrize || '—'}`,
    `Team: ${r.teamName || '—'}`,
    `Guild: ${r.guild || '—'}`,
    `IGL: ${r.iglContact || '—'}`,
    `Verify Code: *${r.verifyCode || '—'}*`,
    '',
    'Please verify my payment registration.'
  ].join('\n');
}

window.sendCode = async (id) => {
  const r = regs.find(x => x.id === id);
  if(!r || !r.verifyCode) return;
  try { await updateDoc(doc(db, 'registrations', id), { codeSentToAdmin: true }); } catch(_){}
  let phone = adminWa;
  if(phone.startsWith('0')) phone = phone.slice(1);
  if(phone && !phone.startsWith('91') && phone.length === 10) phone = '91' + phone;
  const url = phone
    ? `https://wa.me/${phone}?text=${encodeURIComponent(invoice(r))}`
    : `https://wa.me/?text=${encodeURIComponent(invoice(r))}`;
  window.open(url, '_blank');
  // refresh list
  if(auth.currentUser) loadRegs(auth.currentUser);
};

window.doLogin = async () => {
  try { await signInWithPopup(auth, provider); } catch(e){ alert(e.message || 'Login failed'); }
};

async function loadRegs(user){
  await loadSettings();
  const snap = await getDocs(query(collection(db, 'registrations'), where('userId', '==', user.uid)));
  regs = [];
  snap.forEach(d => regs.push({ id: d.id, ...d.data() }));
  // unpaid codes not yet sent (paid verifying)
  const pending = regs.filter(r =>
    r.matchType === 'paid' &&
    r.verifyCode &&
    r.codeSentToAdmin !== true &&
    (r.status === 'verifying' || r.status === 'pending')
  );
  const el = document.getElementById('app');
  if(!pending.length){
    el.innerHTML = `<div class="h">VERIFY / CODES</div><div class="sub">No pending codes to send. All clear.</div><div class="empty">NOTHING TO VERIFY</div>`;
    return;
  }
  el.innerHTML = `<div class="h">VERIFY / CODES</div><div class="sub">Codes not yet sent to admin — tap to open WhatsApp invoice.</div>` +
    pending.map(r => `
      <div class="card">
        <div class="team">${r.teamName || 'Team'}</div>
        <div class="meta">${r.matchName || ''} · ₹${r.entryFee || 0} · ${(r.status||'').toUpperCase()}</div>
        <div class="code" onclick="sendCode('${r.id}')">${r.verifyCode}</div>
        <button class="btn" type="button" onclick="sendCode('${r.id}')">SEND TO ADMIN WP</button>
      </div>
    `).join('');
}

onAuthStateChanged(auth, (user) => {
  const el = document.getElementById('app');
  if(!user){
    el.innerHTML = `<div class="login"><div class="h">SIGN IN</div><div class="sub">Login with Google to see your verify codes.</div><button class="gbtn" onclick="doLogin()">CONTINUE WITH GOOGLE</button></div>`;
    return;
  }
  loadRegs(user).catch(e => {
    el.innerHTML = `<div class="empty">ERROR LOADING</div>`;
    console.error(e);
  });
});
</script>
</body>
</html>
