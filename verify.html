<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Verify Codes — NotHumans</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Rajdhani',sans-serif;background:#0c0604;color:#fff8f0;min-height:100vh}
:root{--line:rgba(255,180,60,.18);--gold:#ffc61a;--text-dim:rgba(255,248,240,.62);--panel:rgba(28,14,8,.72);--green:#2fe28a}
nav{height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.nav-word{font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px}.nav-word span{color:var(--gold)}
a.back{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:10px;text-decoration:none;letter-spacing:1px}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}.h{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;margin-bottom:6px}
.sub{font-size:13px;color:var(--text-dim);margin-bottom:18px;line-height:1.45}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;margin-bottom:10px}
.team{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:800}.meta{font-size:12px;color:var(--text-dim);margin-top:4px}
.status{display:inline-flex;margin-top:10px;padding:5px 8px;border-radius:6px;border:1px solid rgba(255,198,26,.25);background:rgba(255,198,26,.08);color:var(--gold);font-family:'Orbitron',sans-serif;font-size:8px;font-weight:800;letter-spacing:1px}
.status.sent{color:var(--green);border-color:rgba(47,226,138,.25);background:rgba(47,226,138,.08)}
.code{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:3px;color:var(--gold);margin:10px 0;cursor:pointer}
.btn{display:inline-block;margin-top:6px;padding:10px 14px;border:none;border-radius:8px;background:linear-gradient(135deg,#ffc61a,#ff9d00);color:#1a0a00;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;cursor:pointer}
.btn.sent{background:rgba(47,226,138,.12);border:1px solid rgba(47,226,138,.3);color:var(--green)}
.empty{text-align:center;padding:40px 12px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;color:var(--text-dim)}
.login{text-align:center;padding:40px 16px}.gbtn{display:inline-flex;background:#fff;color:#111;border:none;border-radius:10px;padding:12px 18px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:800;cursor:pointer}
.note{margin-top:12px;font-size:11px;line-height:1.5;color:var(--text-dim)}
</style>
</head>
<body>
<nav><div class="nav-word">NH <span>VERIFY</span></div><a class="back" href="index.html">HOME</a></nav>
<div class="wrap" id="app"><div class="empty">LOADING…</div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
import {getFirestore,doc,getDoc,updateDoc,collection,query,where,getDocs} from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

const firebaseConfig={apiKey:"AIzaSyDrg8CHeOGiPR9kFLSTreRbP4p8TGF9jMY",authDomain:"nothumans-7e285.firebaseapp.com",projectId:"nothumans-7e285",storageBucket:"nothumans-7e285.firebasestorage.app",messagingSenderId:"409725804600",appId:"1:409725804600:web:ec0344bf1ac49a55edc6cd"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
let adminWa='',regs=[];

async function loadSettings(){
  try{const s=await getDoc(doc(db,'settings','global'));if(s.exists()){const d=s.data();adminWa=String(d.adminWhatsapp||d.whatsapp||'').replace(/\D/g,'')}}catch(_){}
}
function invoice(r){return ['*NH ENTRY INVOICE*','',`Tournament: ${r.matchName||'—'}`,`Entry: ₹${r.entryFee||0}`,`Date/Time: ${r.matchTime||'—'}`,`Prize Pool: ${r.matchPrize||'—'}`,`Team: ${r.teamName||'—'}`,`Guild: ${r.guild||'—'}`,`IGL: ${r.iglContact||'—'}`,`Verify Code: *${r.verifyCode||'—'}*`,'','Please verify my payment registration.'].join('\n')}

function isAdminConfirmed(r){
  return String(r.status||'').trim().toLowerCase()==='confirmed';
}
function visibleRegs(){
  return regs.filter(r=>r.matchType==='paid'&&r.verifyCode&&!isAdminConfirmed(r));
}

window.sendCode=async(id)=>{
  const r=regs.find(x=>x.id===id);if(!r||!r.verifyCode)return;
  try{await updateDoc(doc(db,'registrations',id),{codeSentToAdmin:true});r.codeSentToAdmin=true}catch(e){console.error(e)}
  let phone=adminWa;if(phone.startsWith('0'))phone=phone.slice(1);
  if(phone&&!phone.startsWith('91')&&phone.length===10)phone='91'+phone;
  const url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(invoice(r))}`:`https://wa.me/?text=${encodeURIComponent(invoice(r))}`;
  window.open(url,'_blank');renderRegs();
};

function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

function renderRegs(){
  const el=document.getElementById('app'),pending=visibleRegs();
  if(!pending.length){el.innerHTML='<div class="h">VERIFY / CODES</div><div class="sub">Your registration stays here until the admin confirms your payment.</div><div class="empty">NOTHING TO VERIFY</div>';return}
  el.innerHTML='<div class="h">VERIFY / CODES</div><div class="sub">Your registration will remain here until <b>ADMIN CONFIRMS PAYMENT</b>. Sending the code does not remove it.</div>'+
  pending.map(r=>{const sent=r.codeSentToAdmin===true;return `<div class="card">
  <div class="team">${esc(r.teamName||'Team')}</div>
  <div class="meta">${esc(r.matchName||'')} · ₹${r.entryFee||0}</div>
  <div class="status ${sent?'sent':''}">${sent?'✓ CODE SENT · WAITING FOR ADMIN':esc(String(r.status||'PENDING').toUpperCase())+' · PAYMENT VERIFICATION'}</div>
  <div class="code" onclick="sendCode('${esc(r.id)}')">${esc(r.verifyCode)}</div>
  <button class="btn ${sent?'sent':''}" type="button" onclick="sendCode('${esc(r.id)}')">${sent?'RESEND TO ADMIN WP':'SEND TO ADMIN WP'}</button>
  <div class="note">${sent?'Invoice sent. This card disappears only after admin confirms the payment.':'Tap the button to send the complete payment invoice to admin on WhatsApp.'}</div>
  </div>`}).join('');
}

window.doLogin=async()=>{try{await signInWithPopup(auth,provider)}catch(e){alert(e.message||'Login failed')}};
async function loadRegs(user){
  await loadSettings();
  const snap=await getDocs(query(collection(db,'registrations'),where('userId','==',user.uid)));
  regs=[];snap.forEach(d=>regs.push({id:d.id,...d.data()}));renderRegs();
}
onAuthStateChanged(auth,user=>{
  const el=document.getElementById('app');
  if(!user){el.innerHTML='<div class="login"><div class="h">SIGN IN</div><div class="sub">Login with Google to see your verify codes.</div><button class="gbtn" onclick="doLogin()">CONTINUE WITH GOOGLE</button></div>';return}
  loadRegs(user).catch(e=>{console.error(e);el.innerHTML='<div class="empty">ERROR LOADING</div>'});
});
</script>
</body>
</html>
