<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Success — NotHumans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent !important;}
html{-webkit-tap-highlight-color:transparent !important;touch-action:manipulation;}
button,a,div,span,img,input,textarea,select,label{outline:none !important;-webkit-tap-highlight-color:transparent !important;-webkit-touch-callout:none;}
button,a{touch-action:manipulation;}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;}
:root{
  --bg:#0c0604;--bg2:#140a06;--panel:rgba(28,14,8,0.78);
  --line:rgba(255,180,60,0.18);--line-strong:rgba(255,198,26,0.45);
  --text:#fff8f0;--text-dim:rgba(255,248,240,0.62);--text-faint:rgba(255,248,240,0.36);
  --gold:#ffc61a;--gold2:#ff9d00;--orange:#ff6b1a;--green:#2fe28a;--red:#ff3d2e;
  --glass:rgba(255,255,255,0.06);--glass-border:rgba(255,210,120,0.22);
}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,198,26,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,198,26,0.03) 1px,transparent 1px);
  background-size:36px 36px;}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 18%,rgba(255,157,0,.14),transparent 42%),
    radial-gradient(circle at 50% 70%,rgba(196,30,58,.10),transparent 50%),
    linear-gradient(180deg,#0c0604 0%,#140a06 100%);}
nav{position:relative;z-index:10;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(12,6,4,0.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
.nav-word{font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;color:var(--text);text-decoration:none;}
.nav-word span{color:var(--gold);}
.wrap{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:28px 18px 56px;}
.hero-card{
  border:1px solid var(--glass-border);border-radius:18px;background:var(--panel);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:28px 20px 24px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.45),0 0 0 1px rgba(255,198,26,0.06) inset;
  position:relative;overflow:hidden;
}
.hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--orange),var(--red));}
.check-ring{
  width:72px;height:72px;margin:0 auto 18px;border-radius:50%;
  background:rgba(47,226,138,0.1);border:1.5px solid rgba(47,226,138,0.45);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 28px rgba(47,226,138,0.18);
  animation:popIn .55s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes popIn{0%{opacity:0;transform:scale(0.7);}100%{opacity:1;transform:scale(1);}}
.kicker{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
h1{font-family:'Orbitron',sans-serif;font-size:clamp(18px,5vw,22px);font-weight:900;letter-spacing:0.5px;line-height:1.25;margin-bottom:10px;}
.sub{font-size:14px;color:var(--text-dim);line-height:1.5;margin-bottom:20px;}
.invoice{
  text-align:left;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,0.28);
  padding:14px 14px 10px;margin-bottom:18px;
}
.inv-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,180,60,0.08);}
.inv-row:last-child{border-bottom:none;}
.inv-lab{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:1px;color:var(--text-faint);text-transform:uppercase;}
.inv-val{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--text);text-align:right;word-break:break-word;}
.inv-val.gold{color:var(--gold);}
.code-wrap{margin:6px 0 8px;}
.code{
  -webkit-tap-highlight-color:transparent !important;
  outline:none !important;
  -webkit-touch-callout:none;
  font-family:'Orbitron',sans-serif;font-size:clamp(24px,8vw,30px);font-weight:900;letter-spacing:5px;
  color:var(--gold);padding:18px 14px;border:2px solid rgba(255,198,26,0.4);border-radius:14px;
  background:linear-gradient(135deg,rgba(255,198,26,0.12),rgba(255,157,0,0.06));
  cursor:pointer;user-select:all;transition:transform .2s cubic-bezier(0.34,1.56,0.64,1),box-shadow .2s ease;
  box-shadow:0 0 0 0 rgba(255,198,26,0);
}
.code:hover{transform:scale(1.03);box-shadow:0 0 28px rgba(255,198,26,0.28);}
.code:active{transform:scale(0.98);-webkit-tap-highlight-color:transparent !important;outline:none !important;}
.hint{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:1.5px;color:var(--gold);margin:10px 0 4px;text-transform:uppercase;}
.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;
  padding:15px 16px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--orange));color:#1a0a00;
  font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;letter-spacing:1.2px;
  cursor:pointer;transition:filter .15s,transform .15s;
}
.wa-btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
.note{
  margin-top:16px;padding:12px 14px;border-radius:10px;text-align:left;
  border:1px solid var(--line);background:rgba(255,255,255,0.03);
  font-size:12px;color:var(--text-dim);line-height:1.5;
}
.note b{color:var(--gold);}
.back{display:inline-block;margin-top:22px;color:var(--gold);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;text-decoration:none;}
.back:hover{text-decoration:underline;}
.loading{text-align:center;padding:60px 20px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;color:var(--text-dim);}
.empty-card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:36px 20px;text-align:center;}
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.confetti-piece{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;animation:fall linear forwards;opacity:0.9;}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:10000;
  background:rgba(12,6,4,0.95);border:1px solid var(--line-strong);color:var(--gold);
  font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px;padding:10px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion: reduce){
  .check-ring,.code,.confetti-piece{animation:none!important;transition:none!important;}
}

/* NH SHARED USER SIDEBAR */
.nh-user-status{margin:0 0 24px;padding:14px 12px;border:1px solid var(--line,rgba(255,180,60,.18));border-radius:14px;background:rgba(255,255,255,.035);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.nh-user-head{display:flex;align-items:center;gap:10px;min-width:0;}
.nh-user-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:rgba(255,198,26,.1);border:1px solid rgba(255,198,26,.35);flex:none;}
.nh-user-copy{min-width:0;flex:1;}
.nh-user-name{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--text,#fff8f0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nh-user-state{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text-dim,rgba(255,248,240,.62));margin-top:3px;text-transform:uppercase;}
.nh-user-state.logged{color:var(--green,#2fe28a);}
.nh-user-actions{display:flex;gap:7px;margin-top:10px;}
.nh-user-btn{flex:1;border:1px solid var(--line,rgba(255,180,60,.18));background:rgba(255,255,255,.035);color:var(--text-dim,rgba(255,248,240,.62));border-radius:8px;padding:8px 7px;font-family:'Orbitron',sans-serif;font-size:8px;font-weight:800;letter-spacing:.8px;cursor:pointer;}
.nh-user-btn:hover{border-color:var(--gold,#ffc61a);color:var(--gold,#ffc61a);}
.nh-user-btn.google{background:linear-gradient(135deg,var(--gold,#ffc61a),var(--orange,#ff6b1a));border-color:transparent;color:#1a0a00;}
.nh-user-btn:disabled{opacity:.55;pointer-events:none;}
.nh-google-dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:#4285f4;font-family:Arial,sans-serif;font-weight:900;font-size:19px;border:1px solid rgba(255,255,255,.7);}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getFirestore, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDrg8CHeOGiPR9kFLSTreRbP4p8TGF9jMY",
  authDomain: "nothumans-7e285.firebaseapp.com",
  projectId: "nothumans-7e285",
  storageBucket: "nothumans-7e285.firebasestorage.app",
  messagingSenderId: "409725804600",
  appId: "1:409725804600:web:ec0344bf1ac49a55edc6cd"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DEFAULTS = {
  kicker: 'REGISTRATION',
  title: 'PAYMENT SUBMITTED',
  subtitle: 'Your squad is in the verification queue. Tap the code to send a full invoice to admin on WhatsApp.',
  hint: 'TAP CODE → ADMIN WHATSAPP',
  note: 'If you skip this, open menu → <b>Verify / Codes</b> anytime to resend.',
  waButton: 'SEND INVOICE ON WHATSAPP',
  emptyTitle: 'NO CODE FOUND',
  emptyMsg: 'Open Verify from the menu if you already registered.',
  confetti: true,
  showInvoice: true,
  fields: {
    tournament: true,
    entry: true,
    time: true,
    prize: true,
    team: true,
    guild: true,
    igl: true
  }
};

let data = null;
let adminWa = '';
let cfg = { ...DEFAULTS, fields: { ...DEFAULTS.fields } };

try { data = JSON.parse(sessionStorage.getItem('nh_success') || 'null'); } catch(_){}

function mergeCfg(raw){
  if(!raw || typeof raw !== 'object') return;
  const f = raw.fields && typeof raw.fields === 'object' ? raw.fields : {};
  cfg = {
    ...DEFAULTS,
    ...raw,
    fields: { ...DEFAULTS.fields, ...f }
  };
}

async function loadSettings(){
  try {
    const snap = await getDoc(doc(db, 'settings', 'global'));
    if(snap.exists()){
      const d = snap.data();
      adminWa = String(d.adminWhatsapp || d.whatsapp || '').replace(/\D/g,'');
      if(d.successPage) mergeCfg(d.successPage);
    }
  } catch(_){}
}

function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildInvoice(){
  if(!data) return '';
  const lines = ['*NH ENTRY INVOICE*', ''];
  const f = cfg.fields || {};
  if(f.tournament !== false) lines.push(`Tournament: ${data.matchName || '—'}`);
  if(f.entry !== false) lines.push(`Entry: ₹${data.entryFee || 0}`);
  if(f.time !== false) lines.push(`Date/Time: ${data.matchTime || '—'}`);
  if(f.prize !== false) lines.push(`Prize Pool: ${data.matchPrize || '—'}`);
  if(f.team !== false) lines.push(`Team: ${data.teamName || '—'}`);
  if(f.guild !== false) lines.push(`Guild: ${data.guild || '—'}`);
  if(f.igl !== false) lines.push(`IGL: ${data.iglContact || '—'}`);
  lines.push(`Verify Code: *${data.code || '—'}*`, '', 'Please verify my payment registration.');
  return lines.join('\n');
}

function invRows(){
  if(!data || cfg.showInvoice === false) return '';
  const f = cfg.fields || {};
  const rows = [];
  if(f.tournament !== false) rows.push(['Tournament', data.matchName || '—', '']);
  if(f.entry !== false) rows.push(['Entry', '₹' + (data.entryFee || 0), 'gold']);
  if(f.time !== false) rows.push(['Date / Time', data.matchTime || '—', '']);
  if(f.prize !== false) rows.push(['Prize', data.matchPrize || '—', 'gold']);
  if(f.team !== false) rows.push(['Team', data.teamName || '—', '']);
  if(f.guild !== false && data.guild) rows.push(['Guild', data.guild, '']);
  if(f.igl !== false && data.iglContact) rows.push(['IGL', data.iglContact, '']);
  if(!rows.length) return '';
  return `<div class="invoice">${rows.map(([l,v,c]) =>
    `<div class="inv-row"><span class="inv-lab">${esc(l)}</span><span class="inv-val ${c}">${esc(v)}</span></div>`
  ).join('')}</div>`;
}

function fireConfetti(){
  if(cfg.confetti === false) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);
  const colors = ['#ffc61a','#ff9d00','#ff6b1a','#2fe28a','#ff3d2e','#fff8f0'];
  for(let i=0;i<36;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100) + '%';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random()*1.8) + 's';
    p.style.animationDelay = (Math.random()*0.4) + 's';
    p.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
    layer.appendChild(p);
  }
  setTimeout(() => layer.remove(), 4200);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

window.sendCodeToAdmin = async () => {
  if(!data || !data.code) return;
  const text = buildInvoice();
  if(data.regId){
    try { await updateDoc(doc(db, 'registrations', data.regId), { codeSentToAdmin: true }); } catch(_){}
  }
  let phone = adminWa;
  if(phone.startsWith('0')) phone = phone.slice(1);
  if(phone && !phone.startsWith('91') && phone.length === 10) phone = '91' + phone;
  const url = phone
    ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}`
    : `https://wa.me/?text=${encodeURIComponent(text)}`;
  toast('OPENING WHATSAPP…');
  window.open(url, '_blank');
};
