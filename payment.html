<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Payment — NotHumans</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Rajdhani',sans-serif;background:#0c0604;color:#fff8f0;min-height:100vh;}
:root{--line:rgba(255,180,60,0.18);--gold:#ffc61a;--orange:#ff6b1a;--text-dim:rgba(255,248,240,0.62);--panel:rgba(28,14,8,0.72);}
nav{height:56px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(12,6,4,0.9);}
.nav-word{font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;}
.nav-word span{color:var(--gold);}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 48px;}
.h{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;margin-bottom:6px;}
.sub{font-size:13px;color:var(--text-dim);margin-bottom:20px;line-height:1.4;}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:18px;margin-bottom:14px;}
.meta{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;margin-bottom:8px;}
.meta b{color:var(--gold);}
.qr-box{text-align:center;padding:12px;}
.qr-box img{width:200px;height:200px;border-radius:12px;background:#fff;padding:8px;}
.upi{font-family:'Orbitron',sans-serif;font-size:12px;margin-top:10px;color:var(--gold);word-break:break-all;}
.amt{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;color:var(--gold);margin:8px 0;}
.dz{border:2px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;position:relative;background:rgba(0,0,0,0.25);}
.dz:hover,.dz.over{border-color:var(--gold);}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1;}
.dz-txt{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:1px;color:var(--text-dim);margin-top:8px;}
.dz-preview{max-width:100%;border-radius:8px;margin-top:10px;display:none;}
.prog{display:none;align-items:center;gap:8px;margin-top:10px;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--gold);}
.prog.show{display:flex;}
.spin{width:12px;height:12px;border:2px solid rgba(255,198,26,0.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.note{margin-top:12px;padding:12px;border:1px solid rgba(255,61,46,0.4);background:rgba(255,61,46,0.1);border-radius:10px;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:0.5px;color:#ff8a7a;line-height:1.45;}
.submit{width:100%;margin-top:16px;padding:16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#1a0a00;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;letter-spacing:1.5px;cursor:pointer;display:none;transition:opacity .2s ease,transform .15s ease,filter .15s ease;}
.submit.show{display:block;}
.submit:disabled{opacity:0.55;cursor:not-allowed;}
.submit:not(:disabled):hover{filter:brightness(1.06);transform:translateY(-1px);}
.err{display:none;margin-top:12px;font-family:'Orbitron',sans-serif;font-size:10px;color:#ff6b6b;letter-spacing:1px;}
.loading{text-align:center;padding:40px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;color:var(--text-dim);}

/* NH SHARED USER SIDEBAR */
.nh-user-status{margin:0 0 24px;padding:14px 12px;border:1px solid var(--line,rgba(255,180,60,.18));border-radius:14px;background:rgba(255,255,255,.035);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.nh-user-head{display:flex;align-items:center;gap:10px;min-width:0;}
.nh-user-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:rgba(255,198,26,.1);border:1px solid rgba(255,198,26,.35);flex:none;}
.nh-user-copy{min-width:0;flex:1;}
.nh-user-name{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--text,#fff8f0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nh-user-state{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text-dim,rgba(255,248,240,.62));margin-top:3px;text-transform:uppercase;}
.nh-user-state.logged{color:var(--green,#2fe28a);}
.nh-user-actions{display:flex;gap:7px;margin-top:10px;}
.nh-user-btn{flex:1;border:1px solid var(--line,rgba(255,180,60,.18));background:rgba(255,255,255,.035);color:var(--text-dim,rgba(255,248,240,.62));border-radius:8px;padding:8px 7px;font-family:'Orbitron',sans-serif;font-size:8px;font-weight:800;letter-spacing:.8px;cursor:pointer;}
.nh-user-btn:hover{border-color:var(--gold,#ffc61a);color:var(--gold,#ffc61a);}
.nh-user-btn.google{background:linear-gradient(135deg,var(--gold,#ffc61a),var(--orange,#ff6b1a));border-color:transparent;color:#1a0a00;}
.nh-user-btn:disabled{opacity:.55;pointer-events:none;}
.nh-google-dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:#4285f4;font-family:Arial,sans-serif;font-weight:900;font-size:19px;border:1px solid rgba(255,255,255,.7);}
@media(max-width:420px){.nh-user-status{padding:12px 10px}.nh-user-name{font-size:9px}}
.nh-shell-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:900;opacity:0;pointer-events:none;transition:opacity .4s cubic-bezier(.22,1,.36,1)}.nh-shell-overlay.open{opacity:1;pointer-events:auto}.nh-shell-sidebar{position:fixed;top:0;right:0;bottom:0;width:min(310px,88vw);z-index:901;padding:24px 20px;background:rgba(18,10,6,.72);backdrop-filter:blur(36px) saturate(1.35);-webkit-backdrop-filter:blur(36px) saturate(1.35);border-left:1px solid rgba(255,255,255,.12);box-shadow:-16px 0 50px rgba(0,0,0,.38);transform:translate3d(100%,0,0);transition:transform .45s cubic-bezier(.22,1,.36,1);overflow-y:auto}.nh-shell-sidebar.open{transform:translate3d(0,0,0)}.nh-shell-close{width:36px;height:36px;border:0;background:none;color:var(--text,#fff);margin:0 0 28px auto;display:grid;place-items:center;cursor:pointer}.nh-shell-link{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line,rgba(255,180,60,.18));font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:800;letter-spacing:1.8px;color:var(--text-dim,rgba(255,248,240,.62));text-decoration:none;transition:color .25s ease,transform .3s cubic-bezier(.22,1,.36,1)}.nh-shell-link:before{content:'';width:6px;height:6px;background:var(--gold,#ffc61a);clip-path:polygon(0 0,100% 50%,0 100%)}.nh-shell-link:hover{color:#fff;transform:translateX(4px)}.nh-sidebar-links{display:flex;flex-direction:column}
/* NH SHARED USER SIDEBAR */
.nh-user-status{margin:0 0 24px;padding:14px 12px;border:1px solid var(--line,rgba(255,180,60,.18));border-radius:14px;background:rgba(255,255,255,.035);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.nh-user-head{display:flex;align-items:center;gap:10px;min-width:0;}
.nh-user-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:rgba(255,198,26,.1);border:1px solid rgba(255,198,26,.35);flex:none;}
.nh-user-copy{min-width:0;flex:1;}
.nh-user-name{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--text,#fff8f0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nh-user-state{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text-dim,rgba(255,248,240,.62));margin-top:3px;text-transform:uppercase;}
.nh-user-state.logged{color:var(--green,#2fe28a);}
.nh-user-actions{display:flex;gap:7px;margin-top:10px;}
.nh-user-btn{flex:1;border:1px solid var(--line,rgba(255,180,60,.18));background:rgba(255,255,255,.035);color:var(--text-dim,rgba(255,248,240,.62));border-radius:8px;padding:8px 7px;font-family:'Orbitron',sans-serif;font-size:8px;font-weight:800;letter-spacing:.8px;cursor:pointer;}
.nh-user-btn:hover{border-color:var(--gold,#ffc61a);color:var(--gold,#ffc61a);}
.nh-user-btn.google{background:linear-gradient(135deg,var(--gold,#ffc61a),var(--orange,#ff6b1a));border-color:transparent;color:#1a0a00;}
.nh-user-btn:disabled{opacity:.55;pointer-events:none;}
.nh-google-dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:#4285f4;font-family:Arial,sans-serif;font-weight:900;font-size:19px;border:1px solid rgba(255,255,255,.7);}
@media(max-width:420px){.nh-user-status{padding:12px 10px}.nh-user-name{font-size:9px}}
.nh-shell-nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(12,6,4,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line,rgba(255,180,60,.18))}.nh-shell-menu{width:40px;height:40px;border:0;background:none;color:var(--text,#fff);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}.nh-shell-menu:active{transform:scale(.94)}</style>
</head>
<body>
<div class="nh-shell-overlay" id="nh-shell-overlay" onclick="nhCloseMenu()"></div>
<aside class="nh-shell-sidebar" id="nh-shell-sidebar" aria-label="Navigation">
  <button class="nh-shell-close" type="button" onclick="nhCloseMenu()" aria-label="Close menu">✕</button>
  <div class="nh-user-status" id="nh-user-status">
  <div class="nh-user-head">
    <div class="nh-google-dot" id="nh-user-fallback">G</div>
    <img class="nh-user-avatar" id="nh-user-avatar" src="" alt="Google profile" style="display:none" referrerpolicy="no-referrer"/>
    <div class="nh-user-copy">
      <div class="nh-user-name" id="nh-user-name">NOT LOGGED IN</div>
      <div class="nh-user-state" id="nh-user-state">GOOGLE ACCOUNT</div>
    </div>
  </div>
  <div class="nh-user-actions">
    <button class="nh-user-btn google" id="nh-login-btn" type="button" onclick="NHLogin()">LOGIN WITH GOOGLE</button>
    <button class="nh-user-btn" id="nh-logout-btn" type="button" onclick="NHLogout()" style="display:none">LOGOUT</button>
  </div>
</div>
  <nav class="nh-sidebar-links"><a href="index.html#hero" class="nh-shell-link">HOME</a><a href="index.html#tournaments" class="nh-shell-link">TOURNAMENTS</a><a href="rules.html" class="nh-shell-link">RULES</a><a href="verify.html" class="nh-shell-link">VERIFY / CODES</a><a href="index.html#pipeline" class="nh-shell-link">HOW IT WORKS</a><button class="nh-shell-menu" type="button" onclick="nhOpenMenu()" aria-label="Open menu"><svg width="22" height="16" viewBox="0 0 22 16" fill="none"><rect width="22" height="2.2" rx="1" fill="currentColor"/><rect y="6.9" width="16" height="2.2" rx="1" fill="currentColor"/><rect y="13.8" width="10" height="2.2" rx="1" fill="var(--gold,#ffc61a)"/></svg></button></nav>
</aside>
<script>window.nhOpenMenu=()=>{document.getElementById('nh-shell-sidebar')?.classList.add('open');document.getElementById('nh-shell-overlay')?.classList.add('open');document.body.style.overflow='hidden'};window.nhCloseMenu=()=>{document.getElementById('nh-shell-sidebar')?.classList.remove('open');document.getElementById('nh-shell-overlay')?.classList.remove('open');document.body.style.overflow=''};</script>

<nav><div class="nav-word">NH <span>PAYMENT</span></div></nav>
<div class="wrap" id="app">
  <div class="loading" id="boot">LOADING…</div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDrg8CHeOGiPR9kFLSTreRbP4p8TGF9jMY",
  authDomain: "nothumans-7e285.firebaseapp.com",
  projectId: "nothumans-7e285",
  storageBucket: "nothumans-7e285.firebasestorage.app",
  messagingSenderId: "409725804600",
  appId: "1:409725804600:web:ec0344bf1ac49a55edc6cd"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const IMGBB_KEY = '405018efab5e2bd5e75f4dd0040a41c3';

const matchId = new URLSearchParams(location.search).get('matchId') || '';
let payload = null;
let settings = {};
let payUrl = '';
let user = null;

function genCode(){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<6;i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
}

function upiQrUrl(upi, amount, note){
  const pa = encodeURIComponent(upi || '');
  const am = encodeURIComponent(String(amount || 0));
  const tn = encodeURIComponent(note || 'NH Entry');
  const data = `upi://pay?pa=${pa}&pn=NotHumans&am=${am}&cu=INR&tn=${tn}`;
  return `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(data)}`;
}

async function boot(){
  try {
    payload = JSON.parse(sessionStorage.getItem('nh_paid_reg') || 'null');
  } catch(_){ payload = null; }
  if(!payload || payload.matchId !== matchId){
    document.getElementById('boot').textContent = 'NO FORM DATA — START FROM TOURNAMENT AGAIN';
    return;
  }
  try {
    const snap = await getDoc(doc(db, 'settings', 'global'));
    if(snap.exists()) settings = snap.data();
  } catch(_){}
  onAuthStateChanged(auth, (u) => {
    user = u;
    if(!u){ location.href = 'reg.html?matchId=' + encodeURIComponent(matchId); return; }
    render();
  });
}

function render(){
  const upi = settings.upiId || '';
  const amt = payload.entryFee || 0;
  const qr = upi ? upiQrUrl(upi, amt, payload.matchName || 'NH') : '';
  document.getElementById('app').innerHTML = `
    <div class="h">PAY ENTRY</div>
    <div class="sub">${payload.matchName || 'Tournament'} · Scan UPI QR and upload payment screenshot.</div>
    <div class="card">
      <div class="meta">TOURNAMENT <b>${payload.matchName||'—'}</b></div>
      <div class="meta">TEAM <b>${payload.teamName||'—'}</b></div>
      <div class="amt">₹${amt}</div>
      <div class="qr-box">
        ${qr ? `<img src="${qr}" alt="UPI QR"/>` : '<div style="color:#ff6b6b;font-family:Orbitron,sans-serif;font-size:10px;">NO UPI SET IN ADMIN SETTINGS</div>'}
        ${upi ? `<div class="upi">${upi}</div>` : ''}
      </div>
    </div>
    <div class="card">
      <div class="meta" style="margin-bottom:12px;">UPLOAD PAYMENT SCREENSHOT</div>
      <div class="dz" id="dz"
        ondragover="event.preventDefault();this.classList.add('over')"
        ondragleave="this.classList.remove('over')"
        ondrop="window.handleDrop(event)">
        <input type="file" accept="image/*" onchange="if(this.files[0])window.uploadShot(this.files[0])"/>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffc61a" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <div class="dz-txt">TAP OR DROP PAYMENT SS</div>
        <img class="dz-preview" id="prev" alt=""/>
      </div>
      <div class="prog" id="prog"><div class="spin"></div><span id="prog-txt">UPLOADING…</span></div>
      <div class="note">⚠ TRY FOR A FAKE PAYMENT CAN LEAD TO TEAM BAN.</div>
    </div>
    <div class="err" id="err"></div>
    <button class="submit" id="submit-btn" type="button" onclick="window.submitPay()">SUBMIT PAYMENT</button>
  `;
}

window.handleDrop = (e) => {
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if(f) window.uploadShot(f);
};

window.uploadShot = async (file) => {
  if(!file) return;
  const prog = document.getElementById('prog');
  const txt = document.getElementById('prog-txt');
  prog.classList.add('show');
  txt.textContent = 'UPLOADING…';
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById('prev');
    prev.src = e.target.result;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
  try{
    const fd = new FormData();
    fd.append('image', file);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body: fd });
    const json = await res.json();
    if(!json.success) throw new Error('fail');
    payUrl = json.data.url;
    txt.textContent = 'UPLOADED';
    document.getElementById('submit-btn').classList.add('show');
    setTimeout(() => prog.classList.remove('show'), 1000);
  }catch(e){
    txt.textContent = 'FAILED';
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = 'UPLOAD FAILED — TRY AGAIN';
  }
};

window.submitPay = async () => {
  const err = document.getElementById('err');
  err.style.display = 'none';
  if(!payUrl){ err.style.display='block'; err.textContent='UPLOAD SCREENSHOT FIRST'; return; }
  if(!user || !payload){ err.style.display='block'; err.textContent='SESSION EXPIRED'; return; }

  // block duplicate
  try{
    const existing = await getDocs(query(collection(db,'registrations'), where('matchId','==',payload.matchId), where('userId','==',user.uid)));
    if(!existing.empty){
      err.style.display='block';
      err.textContent='ALREADY REGISTERED FOR THIS MATCH';
      return;
    }
  }catch(_){}

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'SUBMITTING…';
  const code = genCode();
  const data = {
    matchId: payload.matchId,
    matchName: payload.matchName || '',
    matchTime: payload.matchTime || '',
    matchPrize: payload.matchPrize || '',
    teamName: payload.teamName || '',
    guild: payload.guild || '',
    iglContact: payload.iglContact || '',
    players: payload.players || [],
    customAnswers: payload.customAnswers || {},
    entryFee: payload.entryFee || 0,
    matchType: 'paid',
    screenshotUrl: payUrl,
    status: 'verifying',
    verifyCode: code,
    codeSentToAdmin: false,
    userId: user.uid,
    userEmail: user.email || '',
    userName: user.displayName || '',
    registeredAt: serverTimestamp()
  };
  try{
    const ref = await addDoc(collection(db, 'registrations'), data);
    sessionStorage.removeItem('nh_paid_reg');
    sessionStorage.setItem('nh_success', JSON.stringify({
      regId: ref.id,
      code,
      matchName: data.matchName,
      matchTime: data.matchTime,
      matchPrize: data.matchPrize,
      entryFee: data.entryFee,
      teamName: data.teamName,
      guild: data.guild,
      iglContact: data.iglContact
    }));
    location.href = 'success.html';
  }catch(e){
    console.error(e);
    err.style.display='block';
    err.textContent = e.code === 'permission-denied' ? 'PERMISSION DENIED' : 'SUBMIT FAILED';
    btn.disabled = false;
    btn.textContent = 'SUBMIT PAYMENT';
  }
};

boot();
</script>
